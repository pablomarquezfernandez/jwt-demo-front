<nav>
  <b>jwt-demo</b>
  <a routerLink="/productos" routerLinkActive="activo">Productos</a>
  <a routerLink="/perfil" routerLinkActive="activo">Perfil</a>
  <!-- Ocultar el enlace es comodidad: la ruta la protege rolGuard y los datos los protege Spring -->
  @if (esAdmin()) {
    <a routerLink="/admin" routerLinkActive="activo">Admin</a>
  }
  <span class="espacio"></span>
  @if (auth.usuario(); as usuario) {
    <span>{{ usuario }}</span>
    <button class="secundario" (click)="salir()">Salir</button>
  } @else {
    <a routerLink="/login" routerLinkActive="activo">Iniciar sesión</a>
  }
</nav>
<main>
  <router-outlet />
</main>
